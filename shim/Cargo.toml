[package]
name = "shim"
version = "0.1.0"
edition = "2021"
rust-version = "1.65"

[dependencies]
tokio = { version = "1.28", features = ["full"] }
bytes = "1.4"
serde = { version = "1.0", features = ["derive", "std"] }
toml = "0.7"
socket2 = "0.4"
protocol = { path = "../protocol" }
clocksync = { path = "../clocksync" }

[lib]
name = "shim_lib"
path = "src/lib.rs"

[[bin]]
name = "shim"
path = "src/main.rs"

# Bare-key quit (src/quit.rs): raw-mode console reads with no terminal crate.
# Both are already in the lockfile -- libc via alsa/nix, windows-sys 0.48 via
# tokio -- so neither adds a dependency version, only API surface.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.48", features = ["Win32_Foundation", "Win32_System_Console"] }

[package]
name = "shim"
version = "0.1.0"
edition = "2021"
rust-version = "1.65"

[dependencies]
tokio = { version = "1.28", features = ["full"] }
bytes = "1.4"
serde = { version = "1.0", features = ["derive", "std"] }
toml = "0.7"
socket2 = "0.4"
protocol = { path = "../protocol" }
clocksync = { path = "../clocksync" }

[lib]
name = "shim_lib"
path = "src/lib.rs"

[[bin]]
name = "shim"
path = "src/main.rs"

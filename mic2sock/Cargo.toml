[package]
name = "mic2sock"
version = "0.1.0"
edition = "2021"
# Load-bearing: a low rust-version is what makes cargo emit a v3 Cargo.lock
# (verified on this toolchain: 1.65 -> v3, no rust-version -> v4). A v4 lockfile
# cannot be parsed by the cargo the Pi runs, so it would break the build before
# compiling anything. Debian bookworm ships rustc 1.63 with cargo 1.65, and 1.65
# still rejects v4.
#
# 1.65 specifically, not lower: protocol/src/gap.rs uses let-else, stabilized in
# 1.65, and the locked winnow 0.4.5 declares rust-version 1.64. An earlier 1.63
# here was simply false -- cargo check would have failed on the Pi for both
# reasons.
#
# Not self-enforcing: a routine `cargo update` can raise a dependency's own MSRV
# past this with no warning.
rust-version = "1.65"

[dependencies]
# alsa 0.8 is the newest line whose MSRV fits rust-version above; the direct
# libc dep is for SCHED_FIFO/mlockall in the capture thread (jackd -R's job).
alsa = "0.8"
libc = "0.2"
serde = { version = "1.0", features = ["derive", "std"] }
toml = "0.7"
tokio = { version = "1.28", features = ["full"] }
socket2 = "0.4"   # IP_TOS (CS6/AC_VO) on accepted sender sockets
protocol = { path = "../protocol" }

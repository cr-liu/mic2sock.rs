[package]
name = "mic2sock"
version = "0.1.0"
edition = "2021"

[dependencies]
jack = { version = "0.11" }
serde = { version = "1.0", features = ["derive", "std"] }
toml = "0.7"
tokio = { version = "1.28", features = ["full"] }
bytes = "1.4"
crossbeam = "0.8"
arc-swap = "1.6"
socket2 = "0.4"
protocol = { path = "../protocol" }

[package]
name = "mic2sock"
version = "0.1.0"
edition = "2021"
# Load-bearing: a low rust-version is what makes cargo emit a v3 Cargo.lock.
# Lockfile v4 needs cargo >=1.80 and Debian bookworm (the Pi) ships 1.63, where
# a v4 lockfile fails to parse before anything is compiled. Not self-enforcing:
# a routine `cargo update` can raise a dep's own MSRV past this without warning.
rust-version = "1.63"

[dependencies]
jack = { version = "0.11" }
serde = { version = "1.0", features = ["derive", "std"] }
toml = "0.7"
tokio = { version = "1.28", features = ["full"] }
bytes = "1.4"
crossbeam = "0.8"
arc-swap = "1.6"
socket2 = "0.4"   # SO_SNDBUF on client sockets; wired up in the tcp_server backlog task
protocol = { path = "../protocol" }

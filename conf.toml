[mic]
start_jackd = true
driver = "alsa"
device_name = "hw:RASPZX16ch"
device_id = 0
sample_rate = 16000
period = 64
n_period = 3
n_channel = 16

[mic_2nd]
use_optional_mic = false
device_name = "hw:Device_3"
n_channel = 1

[speaker]
use_alsa_out = false
device_name = "plughw:Device"
n_channel = 1

[audio_connection]
connect_mic_speaker = false
mic_idx = 0
speaker_idx = 0

[tcp_sender]
listen_port = 7998
max_clients = 100
header_len = 12
sample_per_packet = 160

[tcp_receiver]
host = "none"
port = 4000
header_len = 16
n_channel = 1
sample_per_packet = 160

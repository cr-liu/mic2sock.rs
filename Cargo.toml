[package]
name = "mic2sock"
version = "0.2.0"
edition = "2021"

[dependencies]
alsa = "0.9"
cpal = "0.15"
serde = { version = "1.0", features = ["derive", "std"] }
toml = "0.7"
tokio = { version = "1.28", features = ["full"] }
bytes = "1.4"
crossbeam = "0.8"
ringbuf = "0.4"
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["limit"] }
arc-swap = "1.7"
base64 = "0.22"
subtle = "2.5"
tempfile = "3"
serde_json = "1"

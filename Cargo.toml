[package]
name = "mic2sock"
version = "0.2.0"
edition = "2021"

[dependencies]
alsa = "0.9"
cpal = { version = "0.15", features = ["jack"] }
serde = { version = "1.0", features = ["derive", "std"] }
toml = "0.7"
tokio = { version = "1.28", features = ["full"] }
bytes = "1.4"
crossbeam = "0.8"
ringbuf = "0.4"

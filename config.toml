[mic]
start_jackd = true
# driver = "coreaudio"
driver = "alsa"
device_name = "hw:RASPZX16ch"
# device_name = "hw:ArrayUAC10"
device_id = 0
sample_rate = 16000
period = 32
n_period = 4
n_channel = 16

[speaker]
use_alsa_out = false
# device_name = "plughw:Generic_1"
device_name = "plughw:Device"
# Far-end resend channels appended after the mic channels (the AEC reference).
# 0 = send only the captured mic channels. To re-enable the reference channel set
# this to 1 AND point tcp_receiver.host at the far-end stream; the consumer must
# be built for the matching channel count (see shim CONSUMER_N_CH).
n_channel = 0

[audio_connection]
# connect_mic_speaker = true
connect_mic_speaker = false
mic_idx = 0
speaker_idx = 0

[tcp_sender]
listen_port = 7998
max_clients = 100
header_len = 12
# 32 samples = 2 ms per packet (1036 bytes). The shim reframes to the consumer's
# 160-sample packets; smaller send units cut capture-side latency by ~8 ms and
# give the shim's jitter machinery 2 ms granularity. Must match the shim's spp_in.
sample_per_packet = 32

[tcp_receiver]
host = "none"
port = 4000
header_len = 16
n_channel = 1
sample_per_packet = 160